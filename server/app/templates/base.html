<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  {% if session %}<meta name="csrf-token" content="{{ session.csrf }}">{% endif %}
  <title>{% block title %}PodcasterNG{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body{% if session %} hx-headers='{"X-CSRF-Token": "{{ session.csrf }}"}'{% endif %}>
{% if session %}
  <header class="top">
    <strong>PodcasterNG</strong>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ session.csrf }}">
      <button type="submit" class="link">Log out</button>
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <nav class="tabs" aria-label="Main">
    {% for slug, label in pages %}
      <a href="/{{ slug }}"{% if slug == active %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
{% else %}
  <main class="narrow">{% block public %}{% endblock %}</main>
{% endif %}
</body>
</html>
