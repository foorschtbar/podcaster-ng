# Tests, then builds the server and worker images and pushes them to the GitHub Container Registry:
#   ghcr.io/<owner>/podcaster-ng-server  and  ghcr.io/<owner>/podcaster-ng-worker
# Pushes to master get the tags "latest" and "sha-<commit>", version tags (v1.2.3) get "1.2.3". Pull requests only
# build (no push). Both images are built for amd64 and arm64 (PC, Raspberry Pi).

name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements-dev.txt
            server/requirements.txt
            worker/requirements.txt
      - run: pip install -r server/requirements-dev.txt
      - run: pytest -q -p no:cacheprovider
        working-directory: server

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed for the version
      - id: version
        run: echo "value=$(git describe --tags --always --abbrev=7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/podcaster-ng-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=podcaster-ng-${{ matrix.image }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
